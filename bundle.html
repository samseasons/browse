<!doctype html>
<html>
  <head>
    <link href='data:image/gif;base64,R0lGODdhAQABAIABAAAAAICAgCwAAAAAAQABAAACAkw' rel='icon'/>
    <style>body {
  background-color: black;
  color: gray;
}</style>
  </head>
  <body>
    <script>function handle (event) {

  base64 = '$0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz'

  function resolve (f, file) {
    while (f.indexOf('../') == 0) {
      f = f.slice(3)
      file = file.slice(0, file.lastIndexOf('/'))
    }
    f = file.slice(0, file.lastIndexOf('/')) + '/' + f
    var treats = ['', '/', '', '', '/', '\\', '']
    var tricks = ['~', ':', './', '.\\', '//', '\\\\', '../']
    for (var i = 0, length = treats.length; i < length; i++) {
      var treat = treats[i]
      var trick = tricks[i]
      while (f.indexOf(trick) != -1) {
        f = f.replaceAll(trick, treat)
      }
    }
    var i = f[0]
    while (i == '/' || i == '\\') {
      f = f.slice(1)
      i = f[0]
    }
    if (f.slice(-3) != '.js') {
      f += '.js'
    }
    return f
  }

  async function parse (file, modules, texts) {
    var text
    if (file in files) {
      text = await read(file)
    } else {
      texts[file] = ''
      return
    }
    var lines = text.split('\n')
    var remove = false
    text = ''
    var i, j, k
    for (var i = 0, length = lines.length; i < length; i++) {
      var line = lines[i]
      if (line.replace(/^\s+/, '').indexOf('//') == 0) {
        continue
      }
      if (!remove && (j = line.indexOf('/*')) != -1 && line.indexOf('//*') == -1) {
        if ((k = line.indexOf('*/')) != -1) {
          line = line.slice(0, j) + ' ' + line.slice(k + 2)
        } else {
          line = line.slice(0, j)
          remove = true
        }
      }
      if (remove) {
        if ((j = line.indexOf('*/')) != -1) {
          line = line.slice(j + 2)
          remove = false
        } else {
          continue
        }
      }
      line = line.replace(/\s+$/, '')
      if (line) {
        text += line + '\n'
      }
    }
    var defaults = {}
    var exports = {}
    exports[file] = {}
    var order = []
    var texta = text
    while ((i = text.indexOf('import ')) != -1) {
      if (i != 0) {
        j = text[i - 1]
        if (j != '\t' && j != '\n' && j != ' ') {
          text = text.slice(i + 6)
          continue
        }
      }
      i += 6
      while (text[i] == ' ') {
        i += 1
      }
      var defaulted = ''
      var names = {}
      text = text.slice(i)
      i = text.indexOf('from')
      j = text.indexOf('"')
      k = text.indexOf("'")
      if (i != -1 && (i < j || j == -1) && (i < k || k == -1)) {
        var length = text.length
        while (i < length) {
          j = text[i - 1]
          k = text[i + 4]
          if ((j == ' ' || j == '}') && (k == ' ' || k == '"' || k == "'")) {
            break
          }
          i += 4
          i += text.slice(i).indexOf('from')
        }
        var variables = text.slice(0, i)
        if ((j = variables.indexOf('{')) != -1) {
          k = variables.indexOf('}')
          var split = variables.slice(j + 1, k).split(',')
          variables = variables.slice(0, j)
          for (j = 0, length = split.length; j < length; j++) {
            var name = split[j].replace(/^\s+/, '').replace(/\s+$/, '')
            if ((k = name.indexOf(' as ')) != -1) {
              names[name.slice(0, k)] = name.slice(k + 4)
            } else if (name) {
              names[name] = name
            }
          }
        }
        var name = variables.slice(0, variables.indexOf(','))
        name = name.replace(/^\s+/, '').replace(/\s+$/, '')
        if (name) {
          defaulted = name
          names[name] = name
        }
        i += 5
        while (text[i] == ' ') {
          i += 1
        }
      } else {
        i = 0
      }
      var f = text[i]
      if (f == '"' || f == "'") {
        text = text.slice(i + 1)
        f = resolve(text.slice(0, text.indexOf(f)), file)
        if (order.indexOf(f) == -1) {
          exports[f] = {}
          order.push(f)
        }
        if (defaulted) {
          defaults[f] = defaulted
        }
        for (name in names) {
          exports[f][name] = names[name]
        }
      }
    }
    var dependencies = false
    var mods = []
    for (var i = 0, length = order.length; i < length; i++) {
      var f = order[i]
      if (!(f in texts)) {
        mods.push(f)
        if (!(f in modules)) {
          dependencies = true
        }
      }
    }
    if (dependencies) {
      modules[file] = mods
      return
    }
    var declares = ['async', 'class', 'const', 'default', 'function', 'let', 'var']
    var defines = ['\n', ' ', '(', ',', '.', '[']
    text = texta
    while ((i = text.indexOf('export ')) != -1) {
      text = text.slice(i + 7)
      if (text.indexOf('default ') == 0) {
        continue
      }
      for (i = 0; i < 7; i++) {
        var name = declares[i]
        j = text.indexOf(name)
        if (j != -1 && j < 3) {
          text = text.slice(j + name.length)
        }
      }
      if ((i = text.indexOf('\n')) != -1) {
        var variables = text.slice(0, i)
        i = 0
        var length = variables.length
        while (i < length && variables[i] == ' ') {
          i += 1
        }
        var split = []
        if (i < length && variables[i] == '{') {
          variables = variables.slice(i + 1)
          split = variables.slice(0, variables.indexOf('}')).split(',')
        } else {
          i = variables.indexOf('(')
          j = variables.indexOf('=')
          if (j == -1 || (i < j && i != -1)) {
            split.push(variables)
          } else {
            while (j != -1 && variables[j + 1] != '>') {
              split.push(variables.slice(0, j))
              variables = variables.slice(j)
              if ((j = variables.indexOf(',')) == -1) {
                break
              }
              variables = variables.slice(j)
              j = variables.indexOf('=')
            }
          }
        }
        for (i = 0, length = split.length; i < length; i++) {
          var name = split[i]
          while (defines.indexOf(name[0]) != -1) {
            name = name.slice(1)
          }
          for (j = 0; j < 6; j++) {
            if ((k = name.indexOf(defines[j])) != -1) {
              name = name.slice(0, k)
            }
          }
          exports[file][name] = name
        }
      }
    }
    var defaulted = ''
    text = texta
    for (var f in exports) {
      var path = f.slice(0, -3)
      var split = path.split('')
      for (var i = 0, length = split.length; i < length; i++) {
        if (base64.indexOf(split[i]) == -1) {
          split[i] = '_'
        }
      }
      path = split.join('')
      if (f == file) {
        defaulted = path
      }
      var exported = exports[f]
      for (var named in exported) {
        var name = exported[named]
        var next = '_' + path
        if (defaults[f] != name) {
          next = named + next
        }
        i = text.indexOf(name)
        j = name.length
        k = next.length
        while (i != -1) {
          if (base64.indexOf(text[i + j]) != -1 || (i != 0 && (base64 + '"\'.').indexOf(text[i - 1]) != -1)) {
            i = text.indexOf(name, i + j)
          } else {
            text = text.slice(0, i) + next + text.slice(i + j)
            i = text.indexOf(name, i + k)
          }
        }
      }
    }
    lines = text.split('\n')
    text = ''
    for (var i = 0, length = lines.length; i < length; i++) {
      var line = lines[i]
      var a = line.replace(/^\s+/, '')
      if (a.indexOf('export default ') == 0) {
        line = '_' + defaulted + ' = ' + a.slice(15)
      } else if (a.indexOf('export ') == 0) {
        line = a.slice(7)
        a = line.replace(/^\s+/, '')
        if (a[0] == '{') {
          continue
        }
      }
      if (line && a.indexOf('import ') != 0) {
        text += line + '\n'
      }
    }
    texts[file] = text
  }

  async function build (html, js) {
    var file = js
    var folder = js.slice(0, js.indexOf('/'))
    var output = folder + '.html'
    var imported = []
    var imports = [file]
    var modules = {}
    var texts = {}
    while (imports.length != 0) {
      file = imports[0]
      if (imported.indexOf(file) != -1) {
        imports.splice(0, 1)
      } else {
        await parse(file, modules, texts)
        if (file in modules) {
          imports = modules[file].concat(imports)
        }
        if (file in texts) {
          imported.push(file)
          imports.splice(0, 1)
        }
      }
    }
    var text = ''
    for (var i = 0, length = imported.length; i < length; i++) {
      text += texts[imported[i]]
    }
    text = text.slice(0, -1)
    text = '<!doctype html><html><body><script>' + text + '<' + '/script></body></html>'
    if (html && html in files) {
      var h = document.createElement('html')
      var t = await read(html)
      h.innerHTML = t
      var links = h.getElementsByTagName('link')
      for (var i = 0, j = 0, length = links.length; i < length; i++) {
        var link = links[j]
        if (link.rel == 'icon') {
          var href = link.href
          link.href = await read(folder + href.slice(href.lastIndexOf('/')), 'data')
          j++
        } else if (link.rel == 'stylesheet') {
          var href = link.href
          var style = document.createElement('style')
          style.textContent = await read(folder + href.slice(href.lastIndexOf('/')), 'text')
          var head = h.querySelector('head')
          head.replaceChild(style, links[j])
        }
      }
      h = h.innerHTML
      t = t.slice(0, 25) + h.slice(0, h.lastIndexOf('<' + '/script')) + t.slice(t.lastIndexOf('<' + '/script'))
      var i = t.indexOf('<script')
      var j = t.indexOf('<' + '/script')
      if (i == -1 || j == -1) {
        i = t.indexOf('</body')
        if (i != -1) {
          text = t.slice(0, i) + text.slice(27, -14) + t.slice(i)
        }
      } else {
        text = t.slice(0, i) + text.slice(27, -14) + t.slice(j + 9)
      }
    }
    var element = document.createElement('a')
    element.download = output
    element.href = 'data:text/plain,' + encodeURIComponent(text)
    document.body.appendChild(element)
    element.click()
    document.body.removeChild(element)
  }

  function read (file, type) {
    return new Promise(function (resolve) {
      var reader = new FileReader()
      reader.onloadend = function (event) {
        resolve(event.target.result)
      }
      if (type == 'data') {
        reader.readAsDataURL(files[file])
      } else {
        reader.readAsText(files[file])
      }
    })
  }

  var files = {}
  var names = event.target.files
  for (var i = 0, length = names.length; i < length; i++) {
    files[names[i].webkitRelativePath] = names[i]
  }
  names = Object.keys(files)
  names.sort()
  var html = ''
  var js = ''
  for (var i = 0, length = names.length; i < length; i++) {
    var name = names[i]
    var extension = name.slice(name.lastIndexOf('.') + 1)
    if (extension == 'html' && html == '') {
      html = name
      if (js) {
        break
      }
    } else if (extension == 'js' && js == '') {
      js = name
      if (html) {
        break
      }
    }
  }
  build(html, js)
}

browse = document.createElement('input')
browse.onchange = handle
browse.type = 'file'
browse.webkitdirectory = true
document.body.appendChild(browse)</script>
  </body>
